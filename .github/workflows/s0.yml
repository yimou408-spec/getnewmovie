name: S0 offline contracts and experiments
on: [push, pull_request]
concurrency:
  group: offline-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-s0.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-s0.txt
      - run: python -m scripts.s0_check
